/* ==================================================
   QUIZ SETTINGS
================================================== */

const QUESTIONS_PER_QUIZ = 10;


/* ==================================================
   VARIABLES
================================================== */

let currentQuestions = [];

let currentQuestionIndex = 0;

let score = 0;

let answered = false;


/* ==================================================
   SHUFFLE
================================================== */

function shuffle(array) {

    const shuffled =
        [...array];

    for (
        let i = shuffled.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    return shuffled;
}


/* ==================================================
   CREATE NEW QUIZ
================================================== */

function createQuiz() {

    score = 0;

    currentQuestionIndex = 0;

    answered = false;

    currentQuestions =
        shuffle(questionBank)
            .slice(
                0,
                QUESTIONS_PER_QUIZ
            )
            .map(function(question) {

                return {

                    question:
                        question.question,

                    answers:
                        shuffle(
                            question.answers
                        ),

                    correct:
                        question.correct

                };

            });


    document.getElementById(
        "quizScreen"
    ).style.display = "block";


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "scoreDisplay"
    ).textContent =
        "Score: 0";


    showQuestion();

}


/* ==================================================
   SHOW QUESTION
================================================== */

function showQuestion() {

    answered = false;

    const currentQuestion =
        currentQuestions[
            currentQuestionIndex
        ];


    const questionNumber =
        document.getElementById(
            "questionNumber"
        );


    const question =
        document.getElementById(
            "question"
        );


    const answers =
        document.getElementById(
            "answers"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    questionNumber.textContent =
        "Question " +
        (currentQuestionIndex + 1) +
        " of " +
        QUESTIONS_PER_QUIZ;


    question.textContent =
        currentQuestion.question;


    answers.innerHTML = "";


    nextButton.style.display =
        "none";


    progress.style.width =
        (
            currentQuestionIndex /
            QUESTIONS_PER_QUIZ *
            100
        ) +
        "%";


    currentQuestion.answers
        .forEach(function(answer) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-button";


            button.type =
                "button";


            button.textContent =
                answer;


            button.addEventListener(
                "click",
                function() {

                    selectAnswer(
                        button,
                        answer,
                        currentQuestion.correct
                    );

                }
            );


            answers.appendChild(
                button
            );

        });

}


/* ==================================================
   SELECT ANSWER
================================================== */

function selectAnswer(
    selectedButton,
    selectedAnswer,
    correctAnswer
) {

    if (answered) {
        return;
    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer-button"
        );


    buttons.forEach(
        function(button) {

            button.disabled =
                true;


            if (
                button.textContent ===
                correctAnswer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if (
        selectedAnswer ===
        correctAnswer
    ) {

        score++;

        selectedButton.classList.add(
            "correct"
        );

    }

    else {

        selectedButton.classList.add(
            "wrong"
        );

    }


    document.getElementById(
        "scoreDisplay"
    ).textContent =
        "Score: " + score;


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    nextButton.style.display =
        "block";


    if (
        currentQuestionIndex ===
        QUESTIONS_PER_QUIZ - 1
    ) {

        nextButton.textContent =
            "🏆 See My Score";

    }

}


/* ==================================================
   NEXT QUESTION
================================================== */

document.getElementById(
    "nextButton"
).addEventListener(
    "click",
    function() {

        currentQuestionIndex++;


        if (
            currentQuestionIndex >=
            QUESTIONS_PER_QUIZ
        ) {

            showResult();

            return;

        }


        showQuestion();

    }
);


/* ==================================================
   SHOW RESULT
================================================== */

function showResult() {

    document.getElementById(
        "quizScreen"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "finalScore"
    ).textContent =
        score +
        " / " +
        QUESTIONS_PER_QUIZ;


    const resultMessage =
        document.getElementById(
            "resultMessage"
        );


    const percentage =
        (
            score /
            QUESTIONS_PER_QUIZ
        ) *
        100;


    if (percentage === 100) {

        resultMessage.textContent =
            "🔥 Perfect score! You're a football master!";

    }

    else if (percentage >= 80) {

        resultMessage.textContent =
            "👏 Excellent! You really know your football!";

    }

    else if (percentage >= 60) {

        resultMessage.textContent =
            "⚽ Great job! Keep improving your football knowledge.";

    }

    else if (percentage >= 40) {

        resultMessage.textContent =
            "👍 Not bad! Try another quiz and beat your score.";

    }

    else {

        resultMessage.textContent =
            "💪 Keep practicing! You can do better in the next quiz.";

    }

}


/* ==================================================
   PLAY ANOTHER QUIZ
================================================== */

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    function() {

        createQuiz();

    }
);


/* ==================================================
   START FIRST QUIZ
================================================== */

createQuiz();

</script>

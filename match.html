<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GoalRush | Match Centre</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            background: #0b3d2e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header a {
            display: inline-block;
            margin-top: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header a:hover {
            color: #4CAF50;
        }

        /* =========================
           MAIN
        ========================== */

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px;
        }

        /* =========================
           MATCH CARD
        ========================== */

        .match-card {
            background: white;
            border-radius: 15px;
            padding: 30px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);

            text-align: center;
        }

        .competition {
            color: #0b3d2e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            background: #0b3d2e;
            color: white;

            font-weight: bold;
        }

        .live {
            background: #c62828;
        }

        .finished {
            background: #555;
        }

        .upcoming {
            background: #856404;
        }

        .teams {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 50px;

            margin: 30px 0;
        }

        .team {
            width: 220px;
        }

        .team img {
            width: 90px;
            height: 90px;

            object-fit: contain;
        }

        .team h2 {
            font-size: 21px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
        }

        /* =========================
           INFO
        ========================== */

        .info {
            margin-top: 20px;

            border-top: 1px solid #ddd;

            padding-top: 15px;
        }

        .info-row {
            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        /* =========================
           EVENTS
        ========================== */

        .events-section {
            margin-top: 25px;

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.10);
        }

        .events-section h2 {
            margin-top: 0;

            color: #0b3d2e;

            text-align: center;
        }

        .timeline {
            margin-top: 20px;
        }

        .event {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 14px 10px;

            border-bottom: 1px solid #eee;
        }

        .event-time {
            width: 50px;

            font-weight: bold;

            color: #0b3d2e;
        }

        .event-icon {
            font-size: 22px;

            width: 30px;

            text-align: center;
        }

        .event-text {
            flex: 1;
        }

        .home-event {
            text-align: left;
        }

        .away-event {
            text-align: right;
        }

        .no-events {
            text-align: center;

            color: #777;

            padding: 20px;
        }

        /* =========================
           LOADING / ERROR
        ========================== */

        .message {
            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;
        }

        .error {
            color: #c62828;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .teams {
                gap: 10px;
            }

            .team {
                width: 40%;
            }

            .team img {
                width: 65px;
                height: 65px;
            }

            .team h2 {
                font-size: 16px;
            }

            .score {
                font-size: 30px;
            }

            .event {
                gap: 8px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>⚽ GoalRush</h1>

    <a href="scores.html">
        ← Back to Scores
    </a>

</header>


<main class="container">


    <!-- MATCH -->

    <div
        id="matchContainer"
        class="message"
    >

        ⚽ Loading match...

    </div>


    <!-- EVENTS -->

    <div
        id="eventsSection"
        class="events-section"
        style="display:none;"
    >

        <h2>
            ⏱️ Match Timeline
        </h2>

        <div
            id="timeline"
            class="timeline"
        ></div>

    </div>


</main>


<script>


// ==================================================
// GET MATCH ID
// ==================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const matchId =
    params.get("id");


const matchContainer =
    document.getElementById(
        "matchContainer"
    );


const eventsSection =
    document.getElementById(
        "eventsSection"
    );


const timeline =
    document.getElementById(
        "timeline"
    );


// ==================================================
// CHECK ID
// ==================================================

if (!matchId) {

    matchContainer.innerHTML = `

        <h2 class="error">
            ❌ No match selected
        </h2>

        <p>
            Please return to the scores
            page and select a match.
        </p>

    `;

}

else {

    loadMatch();

}


// ==================================================
// LOAD MATCH
// ==================================================

async function loadMatch() {

    try {

        const response =
            await fetch(
                "/api/match/" +
                encodeURIComponent(matchId)
            );


        const match =
            await response.json();


        if (!response.ok) {

            throw new Error(
                match.error ||
                "Could not load match"
            );

        }


        displayMatch(match);

        displayEvents(match);

    }

    catch (error) {

        console.error(
            error
        );


        matchContainer.innerHTML = `

            <h2 class="error">
                ❌ Could not load match
            </h2>

            <p>
                ${error.message}
            </p>

        `;

    }

}


// ==================================================
// DISPLAY MATCH
// ==================================================

function displayMatch(match) {

    const home =
        match.homeTeam?.name ||
        "Home Team";


    const away =
        match.awayTeam?.name ||
        "Away Team";


    const homeLogo =
        match.homeTeam?.crest ||
        "";


    const awayLogo =
        match.awayTeam?.crest ||
        "";


    const homeScore =
        match.score?.fullTime?.home ??
        "-";


    const awayScore =
        match.score?.fullTime?.away ??
        "-";


    const competition =
        match.competition?.name ||
        "Football Match";


    const date =
        match.utcDate
        ? new Date(
            match.utcDate
        ).toLocaleString()
        : "Unknown";


    const status =
        getStatus(
            match.status
        );


    matchContainer.className =
        "match-card";


    matchContainer.innerHTML = `

        <div class="competition">

            🏆 ${escapeHTML(
                competition
            )}

        </div>


        <div class="status ${status.className}">

            ${status.text}

        </div>


        <div class="teams">


            <div class="team">

                <img
                    src="${homeLogo}"
                    alt="${escapeHTML(home)}"
                    onerror="this.style.display='none'"
                >

                <h2>
                    ${escapeHTML(home)}
                </h2>

            </div>


            <div>

                <div class="score">

                    ${homeScore}
                    -
                    ${awayScore}

                </div>

            </div>


            <div class="team">

                <img
                    src="${awayLogo}"
                    alt="${escapeHTML(away)}"
                    onerror="this.style.display='none'"
                >

                <h2>
                    ${escapeHTML(away)}
                </h2>

            </div>


        </div>


        <div class="info">

            <div class="info-row">

                📅 <strong>Date:</strong>

                ${date}

            </div>


            <div class="info-row">

                🏟️ <strong>Venue:</strong>

                ${
                    escapeHTML(
                        match.venue ||
                        "Not available"
                    )
                }

            </div>


            <div class="info-row">

                🏆 <strong>Competition:</strong>

                ${escapeHTML(
                    competition
                )}

            </div>


            <div class="info-row">

                📊 <strong>Matchday:</strong>

                ${
                    match.matchday ||
                    "Not available"
                }

            </div>

        </div>

    `;

}


// ==================================================
// STATUS
// ==================================================

function getStatus(status) {

    if (
        status === "IN_PLAY"
    ) {

        return {
            text: "🔴 LIVE",
            className: "live"
        };

    }


    if (
        status === "PAUSED"
    ) {

        return {
            text: "⏸️ HALF TIME",
            className: "live"
        };

    }


    if (
        status === "FINISHED"
    ) {

        return {
            text: "✅ FINISHED",
            className: "finished"
        };

    }


    if (
        status === "POSTPONED"
    ) {

        return {
            text: "⏳ POSTPONED",
            className: "upcoming"
        };

    }


    if (
        status === "CANCELLED"
    ) {

        return {
            text: "❌ CANCELLED",
            className: "finished"
        };

    }


    return {
        text: "🕐 UPCOMING",
        className: "upcoming"
    };

}


// ==================================================
// MATCH EVENTS
// ==================================================

function displayEvents(match) {

    /*
       Some football-data.org plans/API responses
       do not include detailed events.

       If events are available, this function
       displays them.

       Otherwise GoalRush tells the user that
       event information isn't available.
    */


    eventsSection.style.display =
        "block";


    const events =
        match.events ||
        [];


    if (
        events.length === 0
    ) {

        timeline.innerHTML = `

            <div class="no-events">

                ℹ️ Match events are not
                available for this match.

            </div>

        `;

        return;

    }


    timeline.innerHTML = "";


    events.forEach(
        function(event) {

            const minute =
                event.minute ??
                event.time?.elapsed ??
                "";


            let icon =
                "⚽";


            let text =
                "Match event";


            if (
                event.type === "GOAL"
            ) {

                icon = "⚽";

                text =
                    event.player?.name ||
                    "Goal";

            }

            else if (
                event.type === "YELLOW_CARD"
            ) {

                icon = "🟨";

                text =
                    event.player?.name ||
                    "Yellow card";

            }

            else if (
                event.type === "RED_CARD"
            ) {

                icon = "🟥";

                text =
                    event.player?.name ||
                    "Red card";

            }

            else if (
                event.type === "SUBSTITUTION"
            ) {

                icon = "🔄";

                text =
                    event.player?.name ||
                    "Substitution";

            }


            const eventDiv =
                document.createElement(
                    "div"
                );


            eventDiv.className =
                "event";


            eventDiv.innerHTML = `

                <div class="event-time">

                    ${minute ? minute + "'" : ""}

                </div>


                <div class="event-icon">

                    ${icon}

                </div>


                <div class="event-text">

                    ${escapeHTML(text)}

                </div>

            `;


            timeline.appendChild(
                eventDiv
            );

        }
    );

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";


    return div.innerHTML;

}

</script>


</body>

</html>

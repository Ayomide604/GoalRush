<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GoalRush | Match Centre</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f4;
    color: #222;
}

header {
    background: linear-gradient(135deg, #063b2b, #08734f);
    color: white;
    padding: 20px 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header a {
    color: white;
    text-decoration: none;
    display: inline-block;
    margin-top: 9px;
    font-weight: bold;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 20px 12px 60px;
}

/* =========================
   LOADING
========================= */

.message {
    background: white;
    border-radius: 20px;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,.1);
}

.loader {
    width: 40px;
    height: 40px;
    border: 4px solid #ddd;
    border-top-color: #063b2b;
    border-radius: 50%;
    margin: auto auto 15px;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MATCH CARD
========================= */

.match-card {
    background: white;
    border-radius: 22px;
    padding: 25px 15px;
    box-shadow: 0 5px 22px rgba(0,0,0,.12);
    text-align: center;
}

.competition {
    color: #063b2b;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 14px;
}

.status {
    display: inline-block;
    padding: 9px 22px;
    border-radius: 30px;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

.live {
    background: #d62828;
}

.finished {
    background: #555;
}

.upcoming {
    background: #927000;
}

/* =========================
   TEAMS
========================= */

.teams {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin: 30px 0 18px;
}

.team {
    width: 220px;
}

.team img {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

.team h2 {
    font-size: 19px;
    margin: 10px 0 0;
}

.score {
    min-width: 100px;
    font-size: 42px;
    font-weight: bold;
    color: #063b2b;
}

/* =========================
   KICKOFF
========================= */

.kickoff-box {
    background: #f0f7f4;
    border-radius: 15px;
    padding: 15px 10px;
    margin: 18px auto;
    max-width: 550px;
}

.kickoff-date {
    font-size: 15px;
    color: #555;
    margin-bottom: 5px;
}

.kickoff-time {
    font-size: 24px;
    font-weight: bold;
    color: #063b2b;
}

.time-zone {
    font-size: 12px;
    color: #777;
    margin-top: 4px;
}

/* =========================
   MATCH INFO
========================= */

.info {
    border-top: 1px solid #ddd;
    margin-top: 20px;
}

.info-row {
    padding: 14px 8px;
    border-bottom: 1px solid #eee;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.action-button {
    border: none;
    padding: 13px 20px;
    border-radius: 11px;
    background: white;
    color: #063b2b;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
}

.action-button:hover {
    transform: translateY(-1px);
}

/* =========================
   WATCH
========================= */

.watch-card {
    margin-top: 22px;
    padding: 30px 18px;
    border-radius: 22px;
    text-align: center;
    color: white;
    background: linear-gradient(135deg,#063b2b,#08734f);
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.watch-card h2 {
    margin: 0 0 12px;
    font-size: 28px;
}

.watch-card p {
    font-size: 17px;
    line-height: 1.45;
    margin: 10px auto 20px;
    max-width: 650px;
}

.watch-button {
    display: inline-block;
    padding: 15px 25px;
    background: #d62828;
    color: white;
    border-radius: 11px;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: .2s;
}

.watch-button:hover {
    transform: translateY(-2px);
}

.watch-button.disabled {
    background: #777;
    cursor: not-allowed;
    pointer-events: none;
}

.watch-note {
    margin-top: 15px;
    font-size: 13px;
    opacity: .85;
    line-height: 1.5;
}

/* =========================
   LINEUPS
========================= */

.lineups-section {
    margin-top: 25px;
}

.lineups-section > h2 {
    text-align: center;
    color: #063b2b;
    font-size: 27px;
}

.lineup-team-title {
    text-align: center;
    font-weight: bold;
    margin: 18px 0 10px;
    color: #063b2b;
}

/* =========================
   PITCH
========================= */

.pitch {
    position: relative;
    width: 100%;
    max-width: 700px;
    height: 720px;
    margin: auto;

    background:
        repeating-linear-gradient(
            to bottom,
            #176b45 0px,
            #176b45 90px,
            #1b744c 90px,
            #1b744c 180px
        );

    border: 4px solid white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.pitch::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    background: rgba(255,255,255,.85);
}

.pitch::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 145px;
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
}

.center-dot {
    position: absolute;
    width: 7px;
    height: 7px;
    background: white;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    z-index: 2;
}

.penalty-top {
    position: absolute;
    width: 42%;
    height: 17%;
    top: 0;
    left: 29%;
    border: 2px solid white;
    border-top: none;
}

.penalty-bottom {
    position: absolute;
    width: 42%;
    height: 17%;
    bottom: 0;
    left: 29%;
    border: 2px solid white;
    border-bottom: none;
}

/* =========================
   PLAYERS
========================= */

.player {
    position: absolute;
    transform: translate(-50%,-50%);
    width: 76px;
    text-align: center;
    color: white;
    font-weight: bold;
    font-size: 12px;
    z-index: 5;
}

.player-circle {
    width: 43px;
    height: 43px;
    margin: auto;
    border-radius: 50%;
    background: white;
    color: #063b2b;
    border: 3px solid #063b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
}

.away-player .player-circle {
    background: #f4f4f4;
    border-color: #d62828;
    color: #d62828;
}

.player-name {
    margin-top: 4px;
    text-shadow: 0 1px 3px #000;
    line-height: 1.1;
}

.no-lineups {
    background: white;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    color: #777;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

/* =========================
   BENCH
========================= */

.bench {
    background: white;
    border-radius: 16px;
    margin-top: 18px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.bench h3 {
    color: #063b2b;
    margin-top: 0;
}

.bench-player {
    display: inline-block;
    background: #f1f3f2;
    padding: 8px 10px;
    border-radius: 8px;
    margin: 4px;
    font-size: 13px;
}

/* =========================
   EVENTS
========================= */

.events-section {
    margin-top: 25px;
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

.events-section h2 {
    text-align: center;
    color: #063b2b;
}

.event {
    display: flex;
    gap: 12px;
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.event-time {
    width: 50px;
    font-weight: bold;
    color: #063b2b;
}

.event-icon {
    width: 30px;
}

.event-text {
    flex: 1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .container {
        padding: 14px 10px 50px;
    }

    .match-card {
        padding: 22px 10px;
    }

    .teams {
        gap: 3px;
    }

    .team {
        width: 38%;
    }

    .team img {
        width: 65px;
        height: 65px;
    }

    .team h2 {
        font-size: 15px;
        line-height: 1.2;
    }

    .score {
        min-width: 70px;
        font-size: 30px;
    }

    .kickoff-time {
        font-size: 21px;
    }

    .pitch {
        height: 620px;
    }

    .player {
        width: 65px;
        font-size: 10px;
    }

    .player-circle {
        width: 38px;
        height: 38px;
        font-size: 13px;
    }

    .watch-card h2 {
        font-size: 24px;
    }

    .watch-card p {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<header>

    <h1>⚽ GoalRush</h1>

    <a href="scores.html">
        ← Back to Scores
    </a>

</header>


<main class="container">

    <!-- MATCH -->

    <div
        id="matchContainer"
        class="message"
    >

        <div class="loader"></div>

        ⚽ Loading match...

    </div>


    <!-- ACTIONS -->

    <div
        id="actions"
        class="actions"
        style="display:none;"
    >

        <button
            class="action-button"
            onclick="shareMatch()"
        >
            🔗 Share Match
        </button>

        <button
            class="action-button"
            onclick="loadMatch()"
        >
            🔄 Refresh
        </button>

    </div>


    <!-- WATCH -->

    <section
        id="watchSection"
        class="watch-card"
        style="display:none;"
    >

        <h2>📺 Watch Match</h2>

        <p id="watchDescription">
            Checking for an authorized streaming destination...
        </p>

        <a
            id="watchButton"
            class="watch-button disabled"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            🔎 FIND OFFICIAL STREAM
        </a>

        <div class="watch-note">
            GoalRush only links to official or authorized
            broadcast destinations. Availability may depend
            on your country.
        </div>

    </section>


    <!-- LINEUPS -->

    <section
        id="lineupsSection"
        class="lineups-section"
        style="display:none;"
    >

        <h2>👥 Starting Lineups</h2>

        <div id="pitchContainer"></div>

        <div id="benchContainer"></div>

    </section>


    <!-- EVENTS -->

    <section
        id="eventsSection"
        class="events-section"
        style="display:none;"
    >

        <h2>⏱️ Match Timeline</h2>

        <div id="timeline"></div>

    </section>

</main>


<script>

/* ==================================================
   GOALRUSH API
================================================== */

const API_BASE =
    "https://goal-rush-mauve.vercel.app";


/* ==================================================
   MATCH ID
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const matchId =
    params.get("id");


/* ==================================================
   ELEMENTS
================================================== */

const matchContainer =
    document.getElementById(
        "matchContainer"
    );

const actions =
    document.getElementById(
        "actions"
    );

const watchSection =
    document.getElementById(
        "watchSection"
    );

const watchButton =
    document.getElementById(
        "watchButton"
    );

const watchDescription =
    document.getElementById(
        "watchDescription"
    );

const lineupsSection =
    document.getElementById(
        "lineupsSection"
    );

const pitchContainer =
    document.getElementById(
        "pitchContainer"
    );

const benchContainer =
    document.getElementById(
        "benchContainer"
    );

const eventsSection =
    document.getElementById(
        "eventsSection"
    );

const timeline =
    document.getElementById(
        "timeline"
    );


/* ==================================================
   START
================================================== */

if (!matchId) {

    matchContainer.innerHTML = `

        <h2>❌ No match selected</h2>

        <p>
            Please select a match from Scores.
        </p>

        <a href="scores.html">
            ← Back to Scores
        </a>

    `;

} else {

    loadMatch();

}


/* ==================================================
   LOAD MATCH
================================================== */

async function loadMatch() {

    if (!matchId) return;

    try {

        const response =
            await fetch(
                API_BASE +
                "/api/match/" +
                encodeURIComponent(matchId),
                {
                    cache: "no-store"
                }
            );

        const text =
            await response.text();

        let match;

        try {

            match =
                JSON.parse(text);

        } catch {

            throw new Error(
                "GoalRush server returned invalid JSON."
            );

        }

        if (!response.ok) {

            throw new Error(
                match.error ||
                "Could not load match."
            );

        }

        displayMatch(match);

        setupWatchButton(match);

        displayLineups(match);

        displayEvents(match);

        actions.style.display =
            "flex";

    }

    catch(error) {

        console.error(
            "MATCH ERROR:",
            error
        );

        matchContainer.className =
            "message";

        matchContainer.innerHTML = `

            <h2 style="color:#c62828;">
                ❌ Could not load match
            </h2>

            <p>
                ${escapeHTML(error.message)}
            </p>

            <button
                class="action-button"
                onclick="loadMatch()"
            >
                🔄 Try Again
            </button>

        `;

    }

}


/* ==================================================
   DISPLAY MATCH
================================================== */

function displayMatch(match) {

    const home =
        match.homeTeam?.name ||
        "Home Team";

    const away =
        match.awayTeam?.name ||
        "Away Team";

    const homeLogo =
        match.homeTeam?.crest ||
        "";

    const awayLogo =
        match.awayTeam?.crest ||
        "";

    const homeScore =
        match.score?.fullTime?.home ??
        "-";

    const awayScore =
        match.score?.fullTime?.away ??
        "-";

    const competition =
        match.competition?.name ||
        "Football";

    const status =
        getStatus(match.status);

    const kickoff =
        formatKickoff(match.utcDate);

    matchContainer.className =
        "match-card";

    matchContainer.innerHTML = `

        <div class="competition">
            🏆 ${escapeHTML(competition)}
        </div>

        <span class="status ${status.className}">
            ${status.text}
        </span>


        <div class="teams">

            <div class="team">

                ${
                    homeLogo
                    ? `
                        <img
                            src="${escapeAttribute(homeLogo)}"
                            alt="${escapeAttribute(home)}"
                        >
                    `
                    : `
                        <div style="
                            font-size:55px;
                            height:90px;
                        ">
                            ⚽
                        </div>
                    `
                }

                <h2>
                    ${escapeHTML(home)}
                </h2>

            </div>


            <div class="score">

                ${escapeHTML(String(homeScore))}
                -
                ${escapeHTML(String(awayScore))}

            </div>


            <div class="team">

                ${
                    awayLogo
                    ? `
                        <img
                            src="${escapeAttribute(awayLogo)}"
                            alt="${escapeAttribute(away)}"
                        >
                    `
                    : `
                        <div style="
                            font-size:55px;
                            height:90px;
                        ">
                            ⚽
                        </div>
                    `
                }

                <h2>
                    ${escapeHTML(away)}
                </h2>

            </div>

        </div>


        <!-- BIG KICKOFF TIME -->

        <div class="kickoff-box">

            <div class="kickoff-date">

                📅 ${escapeHTML(kickoff.date)}

            </div>

            <div class="kickoff-time">

                🕐 ${escapeHTML(kickoff.time)}

            </div>

            <div class="time-zone">

                Nigeria time (WAT)

            </div>

        </div>


        <div class="info">

            <div class="info-row">

                🏟️ <strong>Venue:</strong>

                ${escapeHTML(
                    match.venue ||
                    "Not available"
                )}

            </div>


            <div class="info-row">

                🏆 <strong>Competition:</strong>

                ${escapeHTML(competition)}

            </div>


            <div class="info-row">

                📊 <strong>Matchday:</strong>

                ${escapeHTML(
                    String(
                        match.matchday ||
                        "Not available"
                    )
                )}

            </div>

        </div>

    `;

}


/* ==================================================
   KICKOFF FORMAT
================================================== */

function formatKickoff(utcDate) {

    if (!utcDate) {

        return {
            date: "Date not available",
            time: "Time not available"
        };

    }

    const date =
        new Date(utcDate);

    if (isNaN(date.getTime())) {

        return {
            date: "Date not available",
            time: "Time not available"
        };

    }


    /*
     * Africa/Lagos = Nigeria time.
     */

    const dateText =
        new Intl.DateTimeFormat(
            "en-NG",
            {
                timeZone: "Africa/Lagos",
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        ).format(date);


    const timeText =
        new Intl.DateTimeFormat(
            "en-NG",
            {
                timeZone: "Africa/Lagos",
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            }
        ).format(date);


    return {
        date: dateText,
        time: timeText
    };

}


/* ==================================================
   STATUS
================================================== */

function getStatus(status) {

    if (
        status === "IN_PLAY"
    ) {

        return {
            text: "🔴 LIVE",
            className: "live"
        };

    }

    if (
        status === "PAUSED"
    ) {

        return {
            text: "⏸️ HALF TIME",
            className: "live"
        };

    }

    if (
        status === "FINISHED"
    ) {

        return {
            text: "✅ FINISHED",
            className: "finished"
        };

    }

    if (
        status === "POSTPONED"
    ) {

        return {
            text: "⚠️ POSTPONED",
            className: "finished"
        };

    }

    if (
        status === "CANCELLED"
    ) {

        return {
            text: "❌ CANCELLED",
            className: "finished"
        };

    }

    return {
        text: "🕐 UPCOMING",
        className: "upcoming"
    };

}


/* ==================================================
   OFFICIAL STREAM
================================================== */

function setupWatchButton(match) {

    watchSection.style.display =
        "block";


    /*
     * Your backend can provide the
     * authorized stream using any
     * of these common fields.
     */

    const streamUrl =
        match.officialStreamUrl ||
        match.streamUrl ||
        match.broadcast?.url ||
        match.broadcast?.streamUrl ||
        "";


    if (
        typeof streamUrl === "string" &&
        /^https:\/\//i.test(streamUrl)
    ) {

        watchButton.href =
            streamUrl;

        watchButton.classList.remove(
            "disabled"
        );

        watchButton.textContent =
            "📺 FIND OFFICIAL STREAM ↗";

        watchDescription.textContent =
            "An official streaming destination is available for this match.";

        return;

    }


    /*
     * No authorized URL has been
     * supplied by the API.
     */

    watchButton.removeAttribute(
        "href"
    );

    watchButton.classList.add(
        "disabled"
    );

    watchButton.textContent =
        "📺 OFFICIAL STREAM UNAVAILABLE";

    watchDescription.textContent =
        "An authorized streaming destination has not been added for this match yet.";

}


/* ==================================================
   LINEUPS
================================================== */

function displayLineups(match) {

    const homeTeam =
        match.homeTeam || {};

    const awayTeam =
        match.awayTeam || {};

    const homeLineup =
        homeTeam.lineup || [];

    const awayLineup =
        awayTeam.lineup || [];

    const homeBench =
        homeTeam.bench || [];

    const awayBench =
        awayTeam.bench || [];


    if (
        homeLineup.length === 0 &&
        awayLineup.length === 0
    ) {

        lineupsSection.style.display =
            "block";

        pitchContainer.innerHTML = `

            <div class="no-lineups">

                👥 Lineup information is not
                available for this match yet.

            </div>

        `;

        return;

    }


    lineupsSection.style.display =
        "block";


    const homeFormation =
        homeTeam.formation ||
        "Formation unavailable";

    const awayFormation =
        awayTeam.formation ||
        "Formation unavailable";


    pitchContainer.innerHTML = `

        <div class="lineup-team-title">

            ${escapeHTML(
                homeTeam.name ||
                "Home"
            )}

            <br>

            <small>
                ${escapeHTML(homeFormation)}
            </small>

        </div>


        <div class="pitch">

            <div class="center-dot"></div>

            <div class="penalty-top"></div>

            <div class="penalty-bottom"></div>

            <div id="homePlayers"></div>

            <div id="awayPlayers"></div>

        </div>


        <div class="lineup-team-title">

            ${escapeHTML(
                awayTeam.name ||
                "Away"
            )}

            <br>

            <small>
                ${escapeHTML(awayFormation)}
            </small>

        </div>

    `;


    const homePlayers =
        document.getElementById(
            "homePlayers"
        );

    const awayPlayers =
        document.getElementById(
            "awayPlayers"
        );


    renderPlayers(
        homeLineup,
        homePlayers,
        true
    );


    renderPlayers(
        awayLineup,
        awayPlayers,
        false
    );


    renderBench(
        homeTeam,
        homeBench,
        awayTeam,
        awayBench
    );

}


/* ==================================================
   RENDER PLAYERS
================================================== */

function renderPlayers(
    players,
    container,
    isHome
) {

    if (!players.length) {
        return;
    }


    const groups = {

        goalkeeper: [],
        defender: [],
        midfielder: [],
        attacker: []

    };


    players.forEach(
        function(player) {

            const position =
                String(
                    player.position ||
                    ""
                ).toLowerCase();


            if (
                position.includes("goal")
            ) {

                groups.goalkeeper.push(
                    player
                );

            }

            else if (
                position.includes("def")
            ) {

                groups.defender.push(
                    player
                );

            }

            else if (
                position.includes("mid")
            ) {

                groups.midfielder.push(
                    player
                );

            }

            else {

                groups.attacker.push(
                    player
                );

            }

        }
    );


    const rows = [

        groups.goalkeeper,
        groups.defender,
        groups.midfielder,
        groups.attacker

    ];


    const yPositions =
        isHome
        ? [91, 72, 53, 32]
        : [9, 28, 47, 68];


    rows.forEach(
        function(row, rowIndex) {

            if (!row.length) {
                return;
            }


            const y =
                yPositions[rowIndex];


            row.forEach(
                function(player, index) {

                    const spacing =
                        70 /
                        Math.max(
                            row.length - 1,
                            1
                        );


                    const x =
                        row.length === 1
                        ? 50
                        : 15 +
                          index * spacing;


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "player " +
                        (
                            isHome
                            ? "home-player"
                            : "away-player"
                        );


                    div.style.left =
                        x + "%";


                    div.style.top =
                        y + "%";


                    const number =
                        player.shirtNumber ??
                        "?";


                    const name =
                        player.name ||
                        "Player";


                    div.innerHTML = `

                        <div class="player-circle">

                            ${escapeHTML(
                                String(number)
                            )}

                        </div>

                        <div class="player-name">

                            ${escapeHTML(
                                shortName(name)
                            )}

                        </div>

                    `;


                    div.title =
                        `${name} • ${
                            player.position ||
                            "Position unknown"
                        }`;


                    container.appendChild(
                        div
                    );

                }
            );

        }
    );

}


/* ==================================================
   BENCH
================================================== */

function renderBench(
    homeTeam,
    homeBench,
    awayTeam,
    awayBench
) {

    if (
        homeBench.length === 0 &&
        awayBench.length === 0
    ) {

        return;

    }


    benchContainer.innerHTML = `

        <div class="bench">

            <h3>
                🪑 ${escapeHTML(
                    homeTeam.shortName ||
                    homeTeam.name ||
                    "Home"
                )} Bench
            </h3>

            ${createBenchPlayers(homeBench)}

        </div>


        <div class="bench">

            <h3>
                🪑 ${escapeHTML(
                    awayTeam.shortName ||
                    awayTeam.name ||
                    "Away"
                )} Bench
            </h3>

            ${createBenchPlayers(awayBench)}

        </div>

    `;

}


function createBenchPlayers(players) {

    if (!players.length) {

        return `
            <span class="bench-player">
                No bench information
            </span>
        `;

    }


    return players.map(
        function(player) {

            return `

                <span class="bench-player">

                    #${escapeHTML(
                        String(
                            player.shirtNumber ??
                            "?"
                        )
                    )}

                    ${escapeHTML(
                        player.name ||
                        "Player"
                    )}

                </span>

            `;

        }
    ).join("");

}


/* ==================================================
   EVENTS
================================================== */

function displayEvents(match) {

    const events =
        match.events || [];


    if (!events.length) {

        return;

    }


    eventsSection.style.display =
        "block";


    timeline.innerHTML =
        "";


    events.forEach(
        function(event) {

            let icon =
                "⚽";

            let text =
                "Match event";


            if (
                event.type ===
                "GOAL"
            ) {

                icon = "⚽";

                text =
                    event.player?.name ||
                    "Goal";

            }

            else if (
                event.type ===
                "YELLOW_CARD"
            ) {

                icon = "🟨";

                text =
                    event.player?.name ||
                    "Yellow card";

            }

            else if (
                event.type ===
                "RED_CARD"
            ) {

                icon = "🟥";

                text =
                    event.player?.name ||
                    "Red card";

            }

            else if (
                event.type ===
                "SUBSTITUTION"
            ) {

                icon = "🔄";

                text =
                    event.player?.name ||
                    "Substitution";

            }


            const minute =
                event.minute ??
                event.time?.elapsed ??
                "";


            timeline.innerHTML += `

                <div class="event">

                    <div class="event-time">

                        ${escapeHTML(
                            String(minute)
                        )}
                        ${minute ? "'" : ""}

                    </div>

                    <div class="event-icon">

                        ${icon}

                    </div>

                    <div class="event-text">

                        ${escapeHTML(text)}

                    </div>

                </div>

            `;

        }
    );

}


/* ==================================================
   SHARE
================================================== */

async function shareMatch() {

    const url =
        window.location.href;

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    "GoalRush Match Centre",

                text:
                    "Check out this match on GoalRush.",

                url: url

            });

        }

        catch(error) {

            console.log(
                "Share cancelled."
            );

        }

        return;

    }


    try {

        await navigator.clipboard.writeText(
            url
        );

        alert(
            "Match link copied!"
        );

    }

    catch(error) {

        alert(
            "Copy this page URL to share the match."
        );

    }

}


/* ==================================================
   SHORT PLAYER NAME
================================================== */

function shortName(name) {

    const parts =
        name.trim().split(/\s+/);


    if (parts.length <= 2) {
        return name;
    }


    return (
        parts[0] +
        " " +
        parts[parts.length - 1]
    );

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


function escapeAttribute(value) {

    return escapeHTML(
        value
    ).replace(
        /"/g,
        "&quot;"
    );

}


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    function() {

        if (matchId) {
            loadMatch();
        }

    },
    60000
);

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GoalRush | Match Centre</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            background: #0b3d2e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header a {
            display: inline-block;
            margin-top: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header a:hover {
            color: #4CAF50;
        }

        /* =========================
           MAIN
        ========================== */

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px;
        }

        /* =========================
           MATCH CARD
        ========================== */

        .match-card {
            background: white;
            border-radius: 15px;
            padding: 30px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);

            text-align: center;
        }

        .competition {
            color: #0b3d2e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-container {
            text-align: center;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;

            background: #856404;
            color: white;

            font-weight: bold;
        }

        .live {
            background: #c62828;
        }

        .finished {
            background: #555;
        }

        .upcoming {
            background: #856404;
        }

        /* =========================
           TEAMS
        ========================== */

        .teams {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 50px;

            margin: 30px 0;
        }

        .team {
            width: 220px;
        }

        .team img {
            width: 90px;
            height: 90px;

            object-fit: contain;
        }

        .team h2 {
            font-size: 21px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #0b3d2e;
        }

        /* =========================
           INFORMATION
        ========================== */

        .info {
            margin-top: 20px;

            border-top: 1px solid #ddd;

            padding-top: 15px;
        }

        .info-row {
            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        /* =========================
           WATCH LIVE
        ========================== */

        .watch-card {
            background: linear-gradient(
                135deg,
                #0b3d2e,
                #126b4f
            );

            color: white;

            border-radius: 15px;

            padding: 30px 20px;

            margin-top: 25px;

            text-align: center;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.18);
        }

        .watch-card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .watch-card p {
            margin: 8px 0 20px;
            opacity: 0.95;
        }

        .watch-button {
            display: inline-block;

            background: #c62828;

            color: white;

            padding: 14px 25px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            font-size: 17px;

            transition: 0.2s;
        }

        .watch-button:hover {
            transform: translateY(-2px);
            background: #a91f1f;
        }

        .external {
            font-size: 13px;
            margin-top: 15px;
            opacity: 0.8;
        }

        /* =========================
           EVENTS
        ========================== */

        .events-section {
            margin-top: 25px;

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.10);
        }

        .events-section h2 {
            margin-top: 0;

            color: #0b3d2e;

            text-align: center;
        }

        .timeline {
            margin-top: 20px;
        }

        .event {
            display: flex;

            align-items: center;

            gap: 15px;

            padding: 14px 10px;

            border-bottom: 1px solid #eee;
        }

        .event-time {
            width: 50px;

            font-weight: bold;

            color: #0b3d2e;
        }

        .event-icon {
            font-size: 22px;

            width: 30px;

            text-align: center;
        }

        .event-text {
            flex: 1;
        }

        .no-events {
            text-align: center;

            color: #777;

            padding: 20px;
        }

        /* =========================
           LOADING
        ========================== */

        .loader {
            width: 35px;
            height: 35px;

            border: 4px solid #ddd;

            border-top:
                4px solid #0b3d2e;

            border-radius: 50%;

            margin: 0 auto 15px;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* =========================
           MESSAGES
        ========================== */

        .message {
            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;
        }

        .error {
            color: #c62828;
        }

        .back-button {
            display: inline-block;

            margin-top: 15px;

            padding: 10px 16px;

            background: #0b3d2e;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #126b4f;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .container {
                padding: 15px 10px;
            }

            .match-card {
                padding: 20px 12px;
            }

            .teams {
                gap: 8px;
            }

            .team {
                width: 40%;
            }

            .team img {
                width: 65px;
                height: 65px;
            }

            .team h2 {
                font-size: 15px;
            }

            .score {
                font-size: 28px;
            }

            .event {
                gap: 8px;
            }

            .watch-card {
                padding: 25px 15px;
            }

            .watch-button {
                width: 100%;
                max-width: 300px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>⚽ GoalRush</h1>

    <a href="scores.html">
        ← Back to Scores
    </a>

</header>


<main class="container">


    <!-- =========================
         MATCH
    ========================== -->

    <div
        id="matchContainer"
        class="message"
    >

        <div class="loader"></div>

        ⚽ Loading match...

    </div>


    <!-- =========================
         WATCH LIVE
    ========================== -->

    <div
        id="watchSection"
        class="watch-card"
        style="display:none;"
    >

        <h2>
            📺 Watch Live
        </h2>

        <p id="watchDescription">
            Watch this match on the official
            streaming provider.
        </p>

        <a
            id="watchButton"
            class="watch-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            🔴 WATCH LIVE ↗
        </a>

        <div class="external">
            Opens the official streaming provider
            in a new page.
        </div>

    </div>


    <!-- =========================
         MATCH EVENTS
    ========================== -->

    <div
        id="eventsSection"
        class="events-section"
        style="display:none;"
    >

        <h2>
            ⏱️ Match Timeline
        </h2>

        <div
            id="timeline"
            class="timeline"
        ></div>

    </div>


</main>


<script>


// ==================================================
// GOALRUSH API
// ==================================================

const API_BASE =
    "https://goal-rush-mauve.vercel.app";


// ==================================================
// OFFICIAL STREAM LINK
// ==================================================
//
// IMPORTANT:
// Put an authorized broadcaster's URL here.
//
// Example:
// "https://official-provider.example/live"
//
// Do NOT put a pirated stream here.
//

const LIVE_STREAM_URL = "";


// ==================================================
// GET MATCH ID
// ==================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const matchId =
    params.get("id");


// ==================================================
// ELEMENTS
// ==================================================

const matchContainer =
    document.getElementById(
        "matchContainer"
    );

const watchSection =
    document.getElementById(
        "watchSection"
    );

const watchButton =
    document.getElementById(
        "watchButton"
    );

const watchDescription =
    document.getElementById(
        "watchDescription"
    );

const eventsSection =
    document.getElementById(
        "eventsSection"
    );

const timeline =
    document.getElementById(
        "timeline"
    );


// ==================================================
// CHECK MATCH ID
// ==================================================

if (!matchId) {

    matchContainer.innerHTML = `

        <h2 class="error">
            ❌ No match selected
        </h2>

        <p>
            Please return to the Scores page
            and select a match.
        </p>

        <a
            href="scores.html"
            class="back-button"
        >
            ← Back to Scores
        </a>

    `;

} else {

    loadMatch();

}


// ==================================================
// LOAD MATCH
// ==================================================

async function loadMatch() {

    try {

        const apiURL =
            API_BASE +
            "/api/match/" +
            encodeURIComponent(
                matchId
            );


        console.log(
            "Loading:",
            apiURL
        );


        const response =
            await fetch(
                apiURL,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const responseText =
            await response.text();


        let match;


        try {

            match =
                JSON.parse(
                    responseText
                );

        }

        catch {

            console.error(
                "Server returned:",
                responseText
            );

            throw new Error(
                "GoalRush server returned invalid data."
            );

        }


        if (!response.ok) {

            throw new Error(
                match.error ||
                "Could not load match."
            );

        }


        displayMatch(match);

        displayEvents(match);

        setupWatchButton(match);

    }

    catch (error) {

        console.error(
            "Match error:",
            error
        );


        matchContainer.innerHTML = `

            <h2 class="error">
                ❌ Could not load match
            </h2>

            <p>
                ${escapeHTML(
                    error.message
                )}
            </p>

            <a
                href="scores.html"
                class="back-button"
            >
                ← Back to Scores
            </a>

        `;

    }

}


// ==================================================
// DISPLAY MATCH
// ==================================================

function displayMatch(match) {

    const home =
        match.homeTeam?.name ||
        "Home Team";


    const away =
        match.awayTeam?.name ||
        "Away Team";


    const homeLogo =
        match.homeTeam?.crest ||
        "";


    const awayLogo =
        match.awayTeam?.crest ||
        "";


    const homeScore =
        match.score?.fullTime?.home ??
        "-";


    const awayScore =
        match.score?.fullTime?.away ??
        "-";


    const competition =
        match.competition?.name ||
        "Football Match";


    const date =
        match.utcDate
        ? new Date(
            match.utcDate
        ).toLocaleString()
        : "Unknown";


    const status =
        getStatus(
            match.status
        );


    matchContainer.className =
        "match-card";


    matchContainer.innerHTML = `

        <div class="competition">

            🏆
            ${escapeHTML(
                competition
            )}

        </div>


        <div class="status-container">

            <div class="status ${status.className}">

                ${status.text}

            </div>

        </div>


        <div class="teams">


            <!-- HOME -->

            <div class="team">

                ${
                    homeLogo
                    ?
                    `
                    <img
                        src="${escapeAttribute(homeLogo)}"
                        alt="${escapeAttribute(home)}"
                    >
                    `
                    :
                    ""
                }


                <h2>

                    ${escapeHTML(
                        home
                    )}

                </h2>

            </div>


            <!-- SCORE -->

            <div>

                <div class="score">

                    ${escapeHTML(
                        String(homeScore)
                    )}

                    -

                    ${escapeHTML(
                        String(awayScore)
                    )}

                </div>

            </div>


            <!-- AWAY -->

            <div class="team">

                ${
                    awayLogo
                    ?
                    `
                    <img
                        src="${escapeAttribute(awayLogo)}"
                        alt="${escapeAttribute(away)}"
                    >
                    `
                    :
                    ""
                }


                <h2>

                    ${escapeHTML(
                        away
                    )}

                </h2>

            </div>


        </div>


        <!-- INFORMATION -->

        <div class="info">


            <div class="info-row">

                📅

                <strong>
                    Date:
                </strong>

                ${escapeHTML(
                    date
                )}

            </div>


            <div class="info-row">

                🏟️

                <strong>
                    Venue:
                </strong>

                ${escapeHTML(
                    match.venue ||
                    "Not available"
                )}

            </div>


            <div class="info-row">

                🏆

                <strong>
                    Competition:
                </strong>

                ${escapeHTML(
                    competition
                )}

            </div>


            <div class="info-row">

                📊

                <strong>
                    Matchday:
                </strong>

                ${escapeHTML(
                    String(
                        match.matchday ||
                        "Not available"
                    )
                )}

            </div>


        </div>

    `;

}


// ==================================================
// STATUS
// ==================================================

function getStatus(status) {

    if (
        status === "IN_PLAY"
    ) {

        return {
            text: "🔴 LIVE",
            className: "live"
        };

    }


    if (
        status === "PAUSED"
    ) {

        return {
            text: "⏸️ HALF TIME",
            className: "live"
        };

    }


    if (
        status === "FINISHED"
    ) {

        return {
            text: "✅ FINISHED",
            className: "finished"
        };

    }


    if (
        status === "POSTPONED"
    ) {

        return {
            text: "⏳ POSTPONED",
            className: "upcoming"
        };

    }


    if (
        status === "CANCELLED"
    ) {

        return {
            text: "❌ CANCELLED",
            className: "finished"
        };

    }


    return {
        text: "🕐 UPCOMING",
        className: "upcoming"
    };

}


// ==================================================
// WATCH BUTTON
// ==================================================

function setupWatchButton(match) {

    /*
     * We only show the button when an
     * authorized stream URL has been added.
     */

    if (
        LIVE_STREAM_URL &&
        LIVE_STREAM_URL.startsWith("https://")
    ) {

        watchSection.style.display =
            "block";

        watchButton.href =
            LIVE_STREAM_URL;

        watchDescription.textContent =
            "Watch this match on the official streaming provider.";

    }

    else {

        watchSection.style.display =
            "block";

        watchButton.removeAttribute(
            "href"
        );

        watchButton.style.opacity =
            "0.6";

        watchButton.textContent =
            "📺 STREAM LINK NOT AVAILABLE";

        watchDescription.textContent =
            "An official live stream link will appear here when one is available.";

        watchButton.onclick =
            function(event) {

                event.preventDefault();

            };

    }

}


// ==================================================
// MATCH EVENTS
// ==================================================

function displayEvents(match) {

    eventsSection.style.display =
        "block";


    const events =
        match.events ||
        [];


    if (
        events.length === 0
    ) {

        timeline.innerHTML = `

            <div class="no-events">

                ℹ️ Match events are not
                available for this match.

            </div>

        `;

        return;

    }


    timeline.innerHTML =
        "";


    events.forEach(
        function(event) {

            const minute =
                event.minute ??
                event.time?.elapsed ??
                "";


            let icon =
                "⚽";


            let text =
                "Match event";


            if (
                event.type === "GOAL"
            ) {

                icon =
                    "⚽";


                text =
                    event.player?.name ||
                    "Goal";

            }

            else if (
                event.type ===
                "YELLOW_CARD"
            ) {

                icon =
                    "🟨";


                text =
                    event.player?.name ||
                    "Yellow card";

            }

            else if (
                event.type ===
                "RED_CARD"
            ) {

                icon =
                    "🟥";


                text =
                    event.player?.name ||
                    "Red card";

            }

            else if (
                event.type ===
                "SUBSTITUTION"
            ) {

                icon =
                    "🔄";


                text =
                    event.player?.name ||
                    "Substitution";

            }


            const eventDiv =
                document.createElement(
                    "div"
                );


            eventDiv.className =
                "event";


            eventDiv.innerHTML = `

                <div class="event-time">

                    ${escapeHTML(
                        String(minute)
                    )}

                    ${minute ? "'" : ""}

                </div>


                <div class="event-icon">

                    ${icon}

                </div>


                <div class="event-text">

                    ${escapeHTML(
                        text
                    )}

                </div>

            `;


            timeline.appendChild(
                eventDiv
            );

        }
    );

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// ==================================================
// ESCAPE ATTRIBUTE
// ==================================================

function escapeAttribute(text) {

    return escapeHTML(
        text
    ).replace(
        /"/g,
        "&quot;"
    );

}


// ==================================================
// AUTO REFRESH
// ==================================================

setInterval(
    function() {

        if (matchId) {

            loadMatch();

        }

    },
    60000
);


</script>


</body>

</html>

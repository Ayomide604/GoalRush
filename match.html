<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoalRush | Match Centre</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#17201c;
}

header{
    background:linear-gradient(135deg,#063b2b,#08734f);
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:29px;
}

header p{
    margin:6px 0 10px;
    opacity:.85;
}

.back{
    display:inline-block;
    color:white;
    text-decoration:none;
    font-weight:bold;
    padding:8px 14px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:18px 12px 50px;
}

/* LOADING */

.message{
    background:white;
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.loader{
    width:42px;
    height:42px;
    border:4px solid #ddd;
    border-top-color:#08734f;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* MATCH */

.match-card{
    background:white;
    border-radius:22px;
    padding:25px 15px;
    box-shadow:0 5px 22px rgba(0,0,0,.1);
    text-align:center;
}

.competition{
    font-size:17px;
    font-weight:bold;
    color:#08734f;
    margin-bottom:12px;
}

.status{
    display:inline-block;
    padding:8px 18px;
    border-radius:30px;
    color:white;
    font-size:14px;
    font-weight:bold;
}

.live{
    background:#d62828;
}

.finished{
    background:#555;
}

.upcoming{
    background:#927000;
}

.cancelled{
    background:#777;
}

.teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:35px;
    margin:28px 0;
}

.team{
    width:230px;
}

.team img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.team h2{
    font-size:19px;
    margin:10px 0 0;
}

.score-box{
    min-width:110px;
}

.score{
    font-size:43px;
    font-weight:900;
    color:#063b2b;
}

.vs{
    font-size:13px;
    color:#777;
    margin-top:3px;
}

.match-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
}

.info-box{
    background:#f5f7f6;
    border-radius:13px;
    padding:13px;
    font-size:14px;
}

.info-box strong{
    display:block;
    margin-bottom:4px;
    color:#063b2b;
}

/* WATCH */

.watch-card{
    margin-top:20px;
    padding:25px 18px;
    border-radius:20px;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#063b2b,#08734f);
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.watch-card h2{
    margin:0 0 8px;
}

.watch-card p{
    opacity:.9;
    line-height:1.5;
}

.watch-button{
    display:inline-block;
    padding:14px 22px;
    background:#d62828;
    color:white;
    border-radius:11px;
    text-decoration:none;
    font-weight:bold;
    margin-top:8px;
}

.watch-button.disabled{
    background:#555;
    cursor:not-allowed;
}

.watch-note{
    margin-top:12px;
    font-size:12px;
    opacity:.75;
}

/* SECTION */

.section{
    margin-top:22px;
    background:white;
    border-radius:20px;
    padding:22px 15px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
}

.section h2{
    text-align:center;
    color:#063b2b;
    margin-top:0;
}

/* EVENTS */

.event{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 5px;
    border-bottom:1px solid #eee;
}

.event:last-child{
    border-bottom:none;
}

.event-time{
    width:45px;
    font-weight:bold;
    color:#08734f;
}

.event-icon{
    width:30px;
    font-size:19px;
}

.event-text{
    flex:1;
}

/* STATS */

.stats{
    max-width:700px;
    margin:auto;
}

.stat{
    margin:15px 0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:14px;
}

.stat-bar{
    height:9px;
    background:#e7ebe9;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.stat-fill{
    height:100%;
    background:#08734f;
    border-radius:20px;
}

/* LINEUPS */

.lineup-title{
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

.pitch{
    position:relative;
    width:100%;
    max-width:700px;
    height:700px;
    margin:auto;
    background:repeating-linear-gradient(
        to bottom,
        #176b45 0,
        #176b45 87px,
        #1d754d 87px,
        #1d754d 174px
    );
    border:4px solid white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.pitch-line{
    position:absolute;
    background:rgba(255,255,255,.85);
}

.half-line{
    left:0;
    right:0;
    top:50%;
    height:2px;
}

.center-circle{
    position:absolute;
    width:145px;
    height:145px;
    border:2px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.center-dot{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.box-top,
.box-bottom{
    position:absolute;
    width:42%;
    height:17%;
    left:29%;
    border:2px solid white;
}

.box-top{
    top:0;
    border-top:0;
}

.box-bottom{
    bottom:0;
    border-bottom:0;
}

.player{
    position:absolute;
    transform:translate(-50%,-50%);
    width:80px;
    text-align:center;
    color:white;
    font-size:11px;
    font-weight:bold;
    z-index:5;
}

.player-circle{
    width:42px;
    height:42px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#063b2b;
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid #063b2b;
    box-shadow:0 2px 7px rgba(0,0,0,.4);
}

.away-player .player-circle{
    border-color:#d62828;
    color:#d62828;
}

.player-name{
    margin-top:4px;
    text-shadow:0 1px 3px #000;
}

/* BENCH */

.bench{
    margin-top:15px;
    padding:18px;
    background:#f6f8f7;
    border-radius:15px;
}

.bench h3{
    color:#063b2b;
    margin-top:0;
}

.bench-player{
    display:inline-block;
    background:white;
    padding:8px 10px;
    border-radius:8px;
    margin:4px;
    font-size:13px;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

/* MOBILE */

@media(max-width:650px){

    header h1{
        font-size:25px;
    }

    .teams{
        gap:5px;
    }

    .team{
        width:35%;
    }

    .team img{
        width:65px;
        height:65px;
    }

    .team h2{
        font-size:14px;
    }

    .score{
        font-size:30px;
    }

    .score-box{
        min-width:70px;
    }

    .match-info{
        grid-template-columns:1fr;
    }

    .pitch{
        height:610px;
    }

    .player{
        width:65px;
        font-size:9px;
    }

    .player-circle{
        width:36px;
        height:36px;
        font-size:12px;
    }

}
</style>
</head>

<body>

<header>
    <h1>⚽ GoalRush</h1>
    <p>Match Centre</p>
    <a class="back" href="scores.html">← Back to Scores</a>
</header>

<main class="container">

    <div id="matchContainer" class="message">
        <div class="loader"></div>
        Loading match...
    </div>

    <!-- WATCH -->
    <section id="watchSection" class="watch-card" style="display:none;">

        <h2>📺 Watch Match</h2>

        <p id="watchDescription">
            Looking for an official broadcaster.
        </p>

        <a
            id="watchButton"
            class="watch-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            🔎 FIND OFFICIAL STREAM
        </a>

        <div class="watch-note">
            GoalRush links only to authorized broadcast destinations.
        </div>

    </section>

    <!-- EVENTS -->
    <section id="eventsSection" class="section" style="display:none;">

        <h2>⏱️ Match Timeline</h2>

        <div id="timeline"></div>

    </section>

    <!-- STATS -->
    <section id="statsSection" class="section" style="display:none;">

        <h2>📊 Match Statistics</h2>

        <div id="stats" class="stats"></div>

    </section>

    <!-- LINEUPS -->
    <section id="lineupsSection" class="section" style="display:none;">

        <h2>👥 Starting Lineups</h2>

        <div id="pitchContainer"></div>

        <div id="benchContainer"></div>

    </section>

</main>

<script>

/* ==================================================
   GOALRUSH API
================================================== */

const API_BASE =
    "https://goal-rush-mauve.vercel.app";


/* ==================================================
   MATCH ID
================================================== */

const params =
    new URLSearchParams(window.location.search);

const matchId =
    params.get("id");


/* ==================================================
   ELEMENTS
================================================== */

const matchContainer =
    document.getElementById("matchContainer");

const watchSection =
    document.getElementById("watchSection");

const watchButton =
    document.getElementById("watchButton");

const watchDescription =
    document.getElementById("watchDescription");

const eventsSection =
    document.getElementById("eventsSection");

const timeline =
    document.getElementById("timeline");

const statsSection =
    document.getElementById("statsSection");

const stats =
    document.getElementById("stats");

const lineupsSection =
    document.getElementById("lineupsSection");

const pitchContainer =
    document.getElementById("pitchContainer");

const benchContainer =
    document.getElementById("benchContainer");


/* ==================================================
   START
================================================== */

if(!matchId){

    matchContainer.innerHTML = `
        <h2>❌ No match selected</h2>
        <p>Select a match from the Scores page.</p>
        <a href="scores.html">← Back to Scores</a>
    `;

}else{

    loadMatch();

}


/* ==================================================
   LOAD MATCH
================================================== */

async function loadMatch(){

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/match/" +
                encodeURIComponent(matchId)
            );

        const text =
            await response.text();

        let match;

        try{

            match =
                JSON.parse(text);

        }catch{

            throw new Error(
                "The GoalRush server returned invalid JSON."
            );

        }

        if(!response.ok){

            throw new Error(
                match.error ||
                "Could not load match."
            );

        }

        displayMatch(match);
        setupWatchButton(match);
        displayEvents(match);
        displayStats(match);
        displayLineups(match);

    }catch(error){

        console.error(
            "MATCH ERROR:",
            error
        );

        matchContainer.innerHTML = `
            <h2 style="color:#c62828;">
                ❌ Could not load match
            </h2>

            <p>
                ${escapeHTML(error.message)}
            </p>

            <button
                onclick="loadMatch()"
                style="
                    border:0;
                    background:#063b2b;
                    color:white;
                    padding:12px 18px;
                    border-radius:10px;
                    font-weight:bold;
                "
            >
                🔄 Try Again
            </button>

            <br><br>

            <a href="scores.html">
                ← Back to Scores
            </a>
        `;

    }

}


/* ==================================================
   MATCH DISPLAY
================================================== */

function displayMatch(match){

    const home =
        match.homeTeam?.name ||
        "Home Team";

    const away =
        match.awayTeam?.name ||
        "Away Team";

    const homeLogo =
        match.homeTeam?.crest || "";

    const awayLogo =
        match.awayTeam?.crest || "";

    const homeScore =
        match.score?.fullTime?.home ??
        "-";

    const awayScore =
        match.score?.fullTime?.away ??
        "-";

    const competition =
        match.competition?.name ||
        "Football";

    const status =
        getStatus(match.status);

    const date =
        match.utcDate
        ? new Date(match.utcDate)
            .toLocaleString([],{
                dateStyle:"medium",
                timeStyle:"short"
            })
        : "Not available";

    const venue =
        match.venue ||
        "Not available";

    matchContainer.className =
        "match-card";

    matchContainer.innerHTML = `

        <div class="competition">
            🏆 ${escapeHTML(competition)}
        </div>

        <span class="status ${status.className}">
            ${status.text}
        </span>

        <div class="teams">

            <div class="team">

                ${homeLogo ? `
                    <img
                        src="${escapeAttribute(homeLogo)}"
                        alt="${escapeAttribute(home)}"
                    >
                ` : ""}

                <h2>
                    ${escapeHTML(home)}
                </h2>

            </div>

            <div class="score-box">

                <div class="score">
                    ${escapeHTML(String(homeScore))}
                    -
                    ${escapeHTML(String(awayScore))}
                </div>

                <div class="vs">
                    ${status.short}
                </div>

            </div>

            <div class="team">

                ${awayLogo ? `
                    <img
                        src="${escapeAttribute(awayLogo)}"
                        alt="${escapeAttribute(away)}"
                    >
                ` : ""}

                <h2>
                    ${escapeHTML(away)}
                </h2>

            </div>

        </div>

        <div class="match-info">

            <div class="info-box">
                📅
                <strong>Date & Time</strong>
                ${escapeHTML(date)}
            </div>

            <div class="info-box">
                🏟️
                <strong>Venue</strong>
                ${escapeHTML(venue)}
            </div>

            <div class="info-box">
                🏆
                <strong>Competition</strong>
                ${escapeHTML(competition)}
            </div>

            <div class="info-box">
                🔢
                <strong>Matchday</strong>
                ${escapeHTML(
                    String(
                        match.matchday ??
                        "Not available"
                    )
                )}
            </div>

        </div>
    `;

}


/* ==================================================
   STATUS
================================================== */

function getStatus(status){

    if(status === "IN_PLAY"){

        return {
            text:"🔴 LIVE",
            short:"LIVE",
            className:"live"
        };

    }

    if(status === "PAUSED"){

        return {
            text:"⏸️ HALF TIME",
            short:"HALF TIME",
            className:"live"
        };

    }

    if(status === "FINISHED"){

        return {
            text:"✅ FINISHED",
            short:"FULL TIME",
            className:"finished"
        };

    }

    if(
        status === "CANCELLED" ||
        status === "POSTPONED"
    ){

        return {
            text:"⚠️ " + status,
            short:status,
            className:"cancelled"
        };

    }

    return {
        text:"🕐 UPCOMING",
        short:"UPCOMING",
        className:"upcoming"
    };

}


/* ==================================================
   OFFICIAL STREAM
================================================== */

/*
   IMPORTANT:
   Leave this empty until you have
   an authorized broadcaster URL.

   Example:

   const OFFICIAL_STREAM_URL =
       "https://example.com/official-match";

*/

const OFFICIAL_STREAM_URL = "";


function setupWatchButton(match){

    watchSection.style.display =
        "block";

    if(
        OFFICIAL_STREAM_URL &&
        OFFICIAL_STREAM_URL.startsWith("https://")
    ){

        watchButton.href =
            OFFICIAL_STREAM_URL;

        watchButton.classList.remove(
            "disabled"
        );

        watchButton.textContent =
            "📺 WATCH OFFICIAL STREAM ↗";

        watchDescription.textContent =
            "Watch through the authorized broadcaster.";

    }else{

        watchButton.removeAttribute(
            "href"
        );

        watchButton.classList.add(
            "disabled"
        );

        watchButton.textContent =
            "📺 OFFICIAL STREAM UNAVAILABLE";

        watchDescription.textContent =
            "An authorized broadcaster link has not been added for this match yet.";

    }

}


/* ==================================================
   EVENTS
================================================== */

function displayEvents(match){

    const events =
        match.events || [];

    if(!events.length){

        return;

    }

    eventsSection.style.display =
        "block";

    timeline.innerHTML = "";

    events.forEach(event => {

        let icon = "📌";
        let text = "Match event";

        const type =
            String(
                event.type ||
                ""
            ).toUpperCase();

        if(type.includes("GOAL")){

            icon = "⚽";

            text =
                event.player?.name ||
                event.scorer?.name ||
                "Goal";

        }else if(
            type.includes("YELLOW")
        ){

            icon = "🟨";

            text =
                event.player?.name ||
                "Yellow card";

        }else if(
            type.includes("RED")
        ){

            icon = "🟥";

            text =
                event.player?.name ||
                "Red card";

        }else if(
            type.includes("SUB")
        ){

            icon = "🔄";

            text =
                event.player?.name ||
                "Substitution";

        }

        const minute =
            event.minute ??
            event.time?.elapsed ??
            "";

        timeline.innerHTML += `

            <div class="event">

                <div class="event-time">
                    ${escapeHTML(String(minute))}
                    ${minute ? "'" : ""}
                </div>

                <div class="event-icon">
                    ${icon}
                </div>

                <div class="event-text">
                    ${escapeHTML(text)}
                </div>

            </div>

        `;

    });

}


/* ==================================================
   STATS
================================================== */

function displayStats(match){

    const statsData =
        match.statistics || [];

    if(!Array.isArray(statsData) ||
       !statsData.length){

        return;

    }

    statsSection.style.display =
        "block";

    stats.innerHTML = "";

    statsData.forEach(item => {

        const home =
            Number(
                item.home ??
                item.homeTeam ??
                0
            );

        const away =
            Number(
                item.away ??
                item.awayTeam ??
                0
            );

        const total =
            home + away;

        const percentage =
            total > 0
            ? (home / total) * 100
            : 50;

        stats.innerHTML += `

            <div class="stat">

                <div class="stat-head">

                    <span>
                        ${escapeHTML(
                            item.type ||
                            item.name ||
                            "Statistic"
                        )}
                    </span>

                    <span>
                        ${home} - ${away}
                    </span>

                </div>

                <div class="stat-bar">

                    <div
                        class="stat-fill"
                        style="width:${percentage}%"
                    ></div>

                </div>

            </div>

        `;

    });

}


/* ==================================================
   LINEUPS
================================================== */

function displayLineups(match){

    const home =
        match.homeTeam || {};

    const away =
        match.awayTeam || {};

    const homePlayers =
        home.lineup || [];

    const awayPlayers =
        away.lineup || [];

    const homeBench =
        home.bench || [];

    const awayBench =
        away.bench || [];

    /*
       football-data.org may not return
       lineup information from this endpoint.
    */

    if(
        !homePlayers.length &&
        !awayPlayers.length
    ){

        lineupsSection.style.display =
            "block";

        pitchContainer.innerHTML = `

            <div class="empty">

                👥 Starting lineups are not
                available for this match yet.

            </div>
        `;

        return;

    }

    lineupsSection.style.display =
        "block";

    pitchContainer.innerHTML = `

        <div class="lineup-title">

            ${escapeHTML(
                home.name || "Home Team"
            )}

            <br>

            <small>
                ${escapeHTML(
                    home.formation ||
                    "Formation unavailable"
                )}
            </small>

        </div>

        <div class="pitch">

            <div class="pitch-line half-line"></div>

            <div class="center-circle"></div>

            <div class="center-dot"></div>

            <div class="box-top"></div>

            <div class="box-bottom"></div>

            <div id="homePlayers"></div>

            <div id="awayPlayers"></div>

        </div>

        <div class="lineup-title">

            ${escapeHTML(
                away.name || "Away Team"
            )}

            <br>

            <small>
                ${escapeHTML(
                    away.formation ||
                    "Formation unavailable"
                )}
            </small>

        </div>

    `;

    renderPlayers(
        homePlayers,
        document.getElementById("homePlayers"),
        true
    );

    renderPlayers(
        awayPlayers,
        document.getElementById("awayPlayers"),
        false
    );

    renderBench(
        home,
        homeBench,
        away,
        awayBench
    );

}


/* ==================================================
   PLAYER RENDERING
================================================== */

function renderPlayers(
    players,
    container,
    isHome
){

    if(!players.length){
        return;
    }

    const groups = {
        goalkeeper:[],
        defender:[],
        midfielder:[],
        attacker:[]
    };

    players.forEach(player => {

        const position =
            String(
                player.position ||
                ""
            ).toLowerCase();

        if(position.includes("goalkeeper")){

            groups.goalkeeper.push(player);

        }else if(position.includes("def")){

            groups.defender.push(player);

        }else if(position.includes("mid")){

            groups.midfielder.push(player);

        }else{

            groups.attacker.push(player);

        }

    });

    const rows = [
        groups.goalkeeper,
        groups.defender,
        groups.midfielder,
        groups.attacker
    ];

    const yPositions =
        isHome
        ? [91,72,53,32]
        : [9,28,47,68];

    rows.forEach(
        (row,rowIndex) => {

            if(!row.length){
                return;
            }

            const y =
                yPositions[rowIndex];

            row.forEach(
                (player,index) => {

                    const x =
                        row.length === 1
                        ? 50
                        : 15 +
                          (
                              index *
                              (70 /
                              (row.length - 1))
                          );

                    const element =
                        document.createElement(
                            "div"
                        );

                    element.className =
                        "player " +
                        (
                            isHome
                            ? "home-player"
                            : "away-player"
                        );

                    element.style.left =
                        x + "%";

                    element.style.top =
                        y + "%";

                    const number =
                        player.shirtNumber ??
                        "?";

                    const name =
                        player.name ||
                        "Player";

                    element.innerHTML = `

                        <div class="player-circle">

                            ${escapeHTML(
                                String(number)
                            )}

                        </div>

                        <div class="player-name">

                            ${escapeHTML(
                                shortName(name)
                            )}

                        </div>

                    `;

                    element.title =
                        name +
                        " • " +
                        (
                            player.position ||
                            "Position unavailable"
                        );

                    container.appendChild(
                        element
                    );

                }
            );

        }
    );

}


/* ==================================================
   BENCH
================================================== */

function renderBench(
    home,
    homeBench,
    away,
    awayBench
){

    if(
        !homeBench.length &&
        !awayBench.length
    ){

        return;

    }

    benchContainer.innerHTML = `

        <div class="bench">

            <h3>
                🪑 ${escapeHTML(
                    home.shortName ||
                    home.name ||
                    "Home"
                )} Bench
            </h3>

            ${createBench(homeBench)}

        </div>

        <div class="bench">

            <h3>
                🪑 ${escapeHTML(
                    away.shortName ||
                    away.name ||
                    "Away"
                )} Bench
            </h3>

            ${createBench(awayBench)}

        </div>
    `;

}


function createBench(players){

    if(!players.length){

        return `
            <span class="bench-player">
                No information
            </span>
        `;

    }

    return players.map(player => `

        <span class="bench-player">

            #${escapeHTML(
                String(
                    player.shirtNumber ??
                    "?"
                )
            )}

            ${escapeHTML(
                player.name ||
                "Player"
            )}

        </span>

    `).join("");

}


/* ==================================================
   PLAYER NAME
================================================== */

function shortName(name){

    const parts =
        String(name)
        .trim()
        .split(/\s+/);

    if(parts.length <= 2){
        return name;
    }

    return (
        parts[0] +
        " " +
        parts[parts.length - 1]
    );

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


function escapeAttribute(value){

    return escapeHTML(value)
        .replace(/"/g,"&quot;");

}


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    () => {

        if(matchId){
            loadMatch();
        }

    },
    60000
);

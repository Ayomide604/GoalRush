<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GoalRush AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #0b3d2e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 8px 0;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .chat-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        #messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 85%;
            padding: 13px 16px;
            margin: 12px 0;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ai {
            background: #eeeeee;
            margin-right: auto;
        }

        .user {
            background: #0b3d2e;
            color: white;
            margin-left: auto;
        }

        .typing {
            color: #666;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #question {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #0b3d2e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:disabled {
            background: #777;
        }

        .clear {
            width: 100%;
            padding: 12px;
            border: none;
            border-top: 1px solid #ddd;
            background: #eee;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            #messages {
                height: 550px;
            }

            .message {
                max-width: 92%;
            }

            #sendButton {
                padding: 12px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>🤖 GoalRush AI</h1>

    <p>Your football assistant</p>

    <a href="index.html">
        ← Back to GoalRush
    </a>

</header>


<div class="container">

    <div class="chat-box">

        <div id="messages">

            <div class="message ai">
                👋 Hi! I'm GoalRush AI.

Ask me anything about football.
            </div>

        </div>


        <div class="input-area">

            <input
                id="question"
                type="text"
                placeholder="Ask GoalRush AI..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>


        <button
            id="clearButton"
            class="clear"
        >
            🗑️ Clear Chat
        </button>

    </div>

</div>


<script>

const API_BASE =
    "https://goalrush-api.vercel.app";


const messages =
    document.getElementById(
        "messages"
    );


const question =
    document.getElementById(
        "question"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const clearButton =
    document.getElementById(
        "clearButton"
    );


// ==================================================
// ADD MESSAGE
// ==================================================

function addMessage(
    text,
    type
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    message.textContent =
        text;

    messages.appendChild(
        message
    );

    messages.scrollTop =
        messages.scrollHeight;

    return message;

}


// ==================================================
// ASK AI
// ==================================================

async function askAI() {

    const text =
        question.value.trim();

    if (!text) {
        return;
    }

    addMessage(
        text,
        "user"
    );

    question.value = "";

    sendButton.disabled =
        true;

    const typing =
        addMessage(
            "GoalRush AI is thinking...",
            "ai"
        );

    typing.classList.add(
        "typing"
    );

    try {

        const response =
            await fetch(
                API_BASE + "/api/ai",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            question: text
                        })
                }
            );


        const responseText =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    responseText
                );

        }

        catch {

            console.error(
                "Server returned:",
                responseText
            );

            throw new Error(
                "The GoalRush server returned a webpage instead of JSON. The API deployment needs to be updated."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "GoalRush AI request failed"
            );

        }


        typing.remove();


        addMessage(
            data.answer ||
            "No answer received.",
            "ai"
        );

    }

    catch (error) {

        console.error(
            "GoalRush AI error:",
            error
        );

        typing.remove();

        addMessage(
            "❌ " + error.message,
            "ai"
        );

    }

    finally {

        sendButton.disabled =
            false;

        question.focus();

    }

}


// ==================================================
// BUTTON
// ==================================================

sendButton.addEventListener(
    "click",
    askAI
);


// ==================================================
// ENTER KEY
// ==================================================

question.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            askAI();

        }

    }
);


// ==================================================
// CLEAR
// ==================================================

clearButton.addEventListener(
    "click",
    function() {

        messages.innerHTML = `

            <div class="message ai">

                👋 Hi! I'm GoalRush AI.

                <br><br>

                Ask me anything about football.

            </div>

        `;

        question.focus();

    }
);

</script>

</body>

</html>
